name: CW diagnostic IPK

# A push on the investigation branch builds an installable Nightly artifact without
# a workflow-dispatch API call or a public release. Reuse the repository's ARM,
# package, firmware and source-bundle gates unchanged.
on:
  push:
    branches: [fix-cw-multiserver]

permissions:
  contents: read

concurrency:
  group: cw-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  date:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.date.outputs.value }}
    steps:
      - id: date
        shell: bash
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: date
    uses: ./.github/workflows/build-package.yml
    with:
      ref: ${{ github.sha }}
      flavor: nightly
      nightly-date: ${{ needs.date.outputs.value }}
      telemetry: development
      artifact: cw-diagnostic-ipk
      source-asset: true
      fwcompat: true
      homebrew-manifest: true
      caches: true
      upload-debug-files: false
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
